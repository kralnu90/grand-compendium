    const used = {}; const cards = B.pool.map((id, k) => { used[id] = (used[id] || 0) + 1; const on = used[id] <= (inDeck[id] || 0); return mini({ id }, { w, h: Math.round(w * 1.38), ring: on ? '#4ade80' : '', dim: !on, click: `Duel.dbToggle(${k})` }); }).join('');
    const n = B.deck.length, wl = wellsFor(B.deck, 40 - n);
    root.innerHTML = `<div class="flex flex-col gap-2 mx-auto w-full" style="max-width:560px">
      ${Util.panel(`<div class="font-display text-amber-300">Build your draft deck</div><div class="text-sm text-amber-100/80">${n} cards + ${40 - n} wellsprings (${Object.keys(wl).map(k => DCOL[k].ic + wl[k]).join(' ')}). Aim for 22 to 24 cards.</div><div class="flex gap-2 flex-wrap justify-center mt-2">${Util.btn('🪄 Auto-build', 'Duel.dbAuto()')}${Util.btn('⚔️ Start the run', 'Duel.dbStart()', 'brass')}</div>`, 'text-center')}

  }
  function dbToggle(k) {
    const B = DS.db, id = B.pool[k], cnt = B.pool.slice(0, k + 1).filter(x => x === id).length, inD = B.deck.filter(x => x === id).length;
    if (cnt <= inD) B.deck.splice(B.deck.indexOf(id), 1); else B.deck.push(id);

  }
  function dbStart() {
    const B = DS.db; if (B.deck.length < 18 || B.deck.length > 28) return Util.toast('Pick between 18 and 28 cards for your deck.');

    root.innerHTML = `<div class="flex flex-col gap-2 mx-auto w-full" style="max-width:560px">
      ${Util.panel(`<div class="flex items-center gap-2"><button onclick="Duel.bRename()" class="font-display text-amber-300 text-lg">✏️ ${B.name}</button><span class="ml-auto stat-chip ${n >= 20 && n <= 26 ? '' : 'text-red-300'}">${n} cards</span></div>
        <div class="text-xs text-amber-100/70 mt-1">Pick 20 to 26 cards (up to 3 of each). Wellsprings are added to make 40: ${Object.keys(wl).map(k => DCOL[k].ic + wl[k]).join(' ') || 'none yet'}.</div>
        <div class="flex gap-2 flex-wrap mt-2">${Util.btn('💾 Save', 'Duel.bSave()', 'brass')}${Util.btn(B.show === 'deck' ? '📚 All cards' : '🃏 My deck', 'Duel.bShow()')}${customDecks().some(d => d.k === B.k) ? Util.btn('🗑 Delete', 'Duel.bDelete()') : ''}</div>`)}
      ${B.show === 'pool' ? `<div class="flex gap-1.5 flex-wrap justify-center">${chip('all', 'All')}${Object.keys(DCOL).map(k => chip(k, DCOL[k].ic + ' ' + DCOL[k].n)).join('')}</div>` : ''}
      <div class="flex flex-wrap gap-1.5 justify-center">${ids.map(id => mini({ id }, { w, h: Math.round(w * 1.38), click: `Duel.bLook('${id}')`, badge: B.cards[id] ? `×${B.cards[id]}` : '', badgeBg: '#15803d', ring: B.cards[id] ? '#4ade80' : '' })).join('') || '<span class="text-amber-100/50 text-sm">No cards yet. Switch to All cards and tap some to add them.</span>'}</div></div>`;
  }
  function bLook(id) {
    const B = DS.bld, n = B.cards[id] || 0;
    modal(bigCard(DCARDS[id]) + `<div class="text-amber-200 text-sm">In deck: ${n}</div>`, [{ label: '➕ Add', primary: true, fn: () => { if (n >= 3) Util.toast('Up to 3 copies of each card.'); else if (bCount(B) >= 26) Util.toast('That\'s the 26-card limit.'); else B.cards[id] = n + 1; render(); bLook(id); } }, { label: '➖ Remove', fn: () => { if (n > 1) B.cards[id] = n - 1; else delete B.cards[id]; render(); if (n > 1) bLook(id); } }, { label: 'Done' }]);
  }
  async function bRename() {
    const names = ['Spellfire', 'Moonlit Host', 'Wild Hunt', 'Storm Court', 'Iron Vigil', 'Night Garden', 'Ember Tide', 'Thornwall', 'Starfall', 'Gravewind'];
    const v = await Util.choose('Name your deck', 'Pick a name:', names.map(n => ({ label: n, value: n })).concat([{ label: 'Cancel', value: null }]));
    if (v) { DS.bld.name = v; render(); }
  }
  function bSave() {
    const B = DS.bld, n = bCount(B); if (n < 20 || n > 26) return Util.toast('A deck needs 20 to 26 cards.');
    const list = customDecks().filter(d => d.k !== B.k); if (list.length >= 8) return Util.toast('You can keep up to 8 decks. Delete one first.');
    list.push({ k: B.k, name: B.name, mage: 'You', cards: bList(B), custom: true }); Store.set('duel_decks', list); Util.toast(`Saved "${B.name}". Pick it when you start a duel.`);
    render();
  }
  async function bDelete() { const v = await Util.choose('Delete this deck?', DS.bld.name, [{ label: 'Delete', value: 1 }, { label: 'Keep', value: 0, primary: true }]); if (!v) return; Store.set('duel_decks', customDecks().filter(d => d.k !== DS.bld.k)); startBuilder(null); }

  /* ---------- setup flow ---------- */
  async function pickDeck(title, exclude) {
    const decks = DSTARTERS.concat(customDecks()).filter(d => d.k !== exclude);
    return Util.choose(title, 'Each starter deck mixes two colours of magic.', decks.map(d => ({ label: `${deckCols(d.cards)} ${d.name}`, value: d.k })).concat([{ label: 'Cancel', value: null }]));
  }
  return {
    async setup() {
      const m = await Util.choose("🪄 Conjurers' Duel", 'Summon creatures, cast spells and bring your rival from 20 life to zero.', [
        { label: '🤖 vs AI', value: 'ai', primary: true }, { label: '👥 Pass & Play', value: 'pp' }, { label: '🏆 Gauntlet', value: 'gauntlet' }, { label: '📦 Draft', value: 'draft' }, { label: '🛠️ Deckbuilder', value: 'builder' }, { label: 'Cancel', value: null }]);

        return k ? { m, k: k === '_new' ? null : k } : null;
      }
      if (m === 'pp') { const a = await pickDeck('Player 1: choose a deck'); if (!a) return null; const b = await pickDeck('Player 2: choose a deck'); if (!b) return null; return { m, a, b }; }
      const a = await pickDeck(m === 'gauntlet' ? 'Gauntlet: choose your deck' : 'Choose your deck'); if (!a) return null;
      return { m, a };
    },
    mount(el, o = {}) {
      root = el; Duel._headless = false;
      if (o.resume) { DS = o.resume; ui = {}; waiter = null; sid++; if (DS.view === 'duel') { lastCfg = DS.cfg || null; loop(true); } else render(); return; }
      const m = o.m || 'ai';
      if (m === 'draft') return startDraft();
      if (m === 'builder') return startBuilder(o.k);
      if (m === 'gauntlet') return startGauntlet(o.a || 'sunfire');
      if (m === 'pp') { const a = deckById(o.a), b = deckById(o.b); return startDuel({ mode: 'pp', decks: [a, b], names: ['Player 1', 'Player 2'] }); }
      const a = deckById(o.a || 'sunfire'), others = DSTARTERS.filter(d => d.k !== a.k), b = others[Math.floor(Math.random() * others.length)];
      startDuel({ mode: 'ai', decks: [a, b], names: ['You', b.mage] });
    },
    snapshot() {
      if (!DS || DS.mode === 'aivai') return null;
      if (DS.view !== 'duel') return DS.view === 'builder' ? null : DS;
      if (DS.over) return null;
      if (DS.ask === 'main' && DS.window !== null && !DS.p[DS.window].ai && !ui.target) { const c = JSON.parse(JSON.stringify(DS)); c.cfg = lastCfg; return c; }
      if (!safe) return null;
      safe.cfg = lastCfg; return safe;
    },
    destroy() { sid++; waiter = null; root = null; document.getElementById('duel-modal')?.remove(); },
    newGame() { if (lastCfg) startDuel(lastCfg); },
    act, tapField, tapPlayer, hand: showHand, grave: showGrave, logView: showLog, cancelTarget() { ui = {}; render(); },
    runDuel, retry() { DS.run.lost = false; DS.run.results.pop(); runDuel(); }, giveUp() { DS.run.done = true; DS.run.lost = false; render(); }, restartRun() { if (DS.run.type === 'draft') startDraft(); else startGauntlet(DSTARTERS.find(d => d.name === DS.run.deck.name)?.k || 'sunfire'); }, viewRunDeck,
    draftLook, dbToggle, dbAuto() { DS.db.deck = autoBuild(DS.db.pool); render(); }, dbStart,

    /* test hooks */
    _aivai(a, b) { Duel._headless = true; startDuel({ mode: 'aivai', decks: [deckById(a), deckById(b)], names: ['A', 'B'] }); }, _fast: false, _headless: false, _results: [], wellsFor, autoBuild, makePack, startDuel

/* ============================================================================
   KNUCKLEBONES: roll, place, knock out your rival's matching dice
   ============================================================================ */
const Knucklebones = (() => {
  let S, root, mode = Store.get('kb_mode', 'ai'), sid = 0, busy = false;
  const colScore = col => { const n = {}; col.forEach(v => n[v] = (n[v] || 0) + 1); return Object.entries(n).reduce((s, [v, k]) => s + v * k * k, 0); };
  const total = g => g.reduce((s, c) => s + colScore(c), 0);
  const full = g => g.every(c => c.length >= 3);
  const names = () => mode === 'ai' ? ['You', 'The Bone Keeper'] : ['Player 1', 'Player 2'];
  function newGame() { sid++; busy = false; S = { g: [[[], [], []], [[], [], []]], turn: Math.random() < .5 ? 0 : 1, die: 0, over: false, last: null, knocked: null }; startTurn(); }
  /* the change in (my total - rival total) from putting die v in column c */
  function gain(st, p, c, v) {
    const mine = st.g[p][c], theirs = st.g[1 - p][c];
    if (mine.length >= 3) return null;
    return colScore(mine.concat(v)) - colScore(mine) + colScore(theirs) - colScore(theirs.filter(x => x !== v));
  }
  function aiPick(p, v) {
    const opts = [0, 1, 2].filter(c => S.g[p][c].length < 3);
    if (Settings.diff === 'easy' && Math.random() < .45) return opts[Math.floor(Math.random() * opts.length)];
    let best = opts[0], bs = -1e9;
    for (const c of opts) {
      let s = gain(S, p, c, v);
      if (Settings.diff !== 'easy') {
        // look one roll ahead: how well can the rival answer, on average?
        const st = { g: S.g.map(g => g.map(col => col.slice())) };
        st.g[p][c].push(v); st.g[1 - p][c] = st.g[1 - p][c].filter(x => x !== v);
        if (full(st.g[p])) s += total(st.g[p]) > total(st.g[1 - p]) ? 500 : -500;
        else {
          let reply = 0;
          for (let r = 1; r <= 6; r++) { let m = -1e9; for (let k = 0; k < 3; k++) { const x = gain(st, 1 - p, k, r); if (x !== null && x > m) m = x; } reply += m / 6; }
          s -= reply * (Settings.diff === 'hard' ? .9 : .6);
        }
        s += Math.random() * .3;
      }
      if (s > bs) { bs = s; best = c; }
    }
    return best;
  }
  async function startTurn() {
    if (S.over) return;
    const my = sid; busy = true; S.die = 0; render();
    await Util.sleep(Util.delay(250)); if (my !== sid) return;
    for (let k = 0; k < 6; k++) { S.die = 1 + Math.floor(Math.random() * 6); render(); await Util.sleep(Util.delay(55)); if (my !== sid) return; }
    Sfx.play('dice'); busy = false; render();
    if (mode === 'ai' && S.turn === 1) {
      busy = true; render(); await Util.sleep(Util.delay(650)); if (my !== sid) return;
      busy = false; place(aiPick(1, S.die), true);
    }
  }
  function place(c, ai) {
    if (S.over || busy || !S.die) return;
    if (!ai && mode === 'ai' && S.turn === 1) return;
    const p = S.turn, v = S.die, col = S.g[p][c];
    if (col.length >= 3) return Util.toast('That column is full.');
    col.push(v);
    const before = S.g[1 - p][c].length; S.g[1 - p][c] = S.g[1 - p][c].filter(x => x !== v);
    const lost = before - S.g[1 - p][c].length;
    S.last = { p, c }; S.knocked = lost ? { p: 1 - p, c, n: lost, v } : null;
    Sfx.play(lost ? 'capture' : 'place');
    if (lost) Util.toast(`Knocked out ${lost === 1 ? 'a ' + v : (lost === 2 ? 'two ' : 'three ') + v + 's'}!`, 1100);
    S.die = 0;
    if (full(S.g[p])) return finish();
    S.turn = 1 - p; startTurn();
  }
  function finish() {
    S.over = true; render();
    const a = total(S.g[0]), b = total(S.g[1]), n = names();
    const w = a === b ? -1 : a > b ? 0 : 1;
    Sfx.play(mode === '2p' || w === 0 ? 'win' : 'lose');
    App.endGame('knucklebones', mode === 'ai' ? w === 0 : w >= 0, w < 0 ? "It's a draw!" : mode === 'ai' ? (w === 0 ? 'You win!' : 'The Bone Keeper wins') : `${n[w]} wins!`, `${n[0]}: ${a} · ${n[1]}: ${b}`, newGame);
  }
  function dieHtml(v, size, glow) {
    const pip = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[v] || [];
    const bg = glow === 3 ? 'linear-gradient(160deg,#cfe6ff,#7fb2ea)' : glow === 2 ? 'linear-gradient(160deg,#fff4c2,#f0c95a)' : 'linear-gradient(160deg,#fffdf6,#e2d4b5)';
    return `<div class="grid" style="width:${size}px;height:${size}px;border-radius:${size * .22}px;background:${bg};box-shadow:0 3px 0 #8f7a4f,0 5px 8px rgba(0,0,0,.45);grid-template:repeat(3,1fr)/repeat(3,1fr);padding:${size * .13}px">${Array.from({ length: 9 }, (_, i) => pip.includes(i) ? `<span style="width:${size * .18}px;height:${size * .18}px;border-radius:50%;background:#2a1a10;place-self:center"></span>` : '<span></span>').join('')}</div>`;
  }
  function board(p, flip) {
    const sz = Math.min(58, Math.floor(((root.clientWidth || 360) - 60) / 3 * .62)), me = S.turn === p && !S.over, canTap = me && S.die && !busy && !(mode === 'ai' && p === 1);
    const cols = S.g[p].map((col, c) => {
      const cnt = {}; col.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
      const cells = [0, 1, 2].map(k => { const v = col[k]; return `<div class="flex items-center justify-center rounded-lg" style="width:${sz + 12}px;height:${sz + 12}px;background:rgba(0,0,0,.25)">${v ? dieHtml(v, sz, cnt[v] > 1 ? cnt[v] : 0) : ''}</div>`; });
      if (flip) cells.reverse();
      const hit = S.knocked && S.knocked.p === p && S.knocked.c === c;
      return `<button ${canTap ? `onclick="Knucklebones.place(${c})"` : 'disabled'} class="flex flex-col items-center gap-1.5 rounded-2xl p-1.5 transition ${canTap && col.length < 3 ? 'ring-2 ring-amber-300/70 hover:bg-amber-300/10' : ''} ${hit ? 'ring-2 ring-red-500' : ''}" style="background:rgba(0,0,0,.18)">
        ${flip ? '' : `<span class="font-bold text-amber-200 text-sm">${colScore(col)}</span>`}${cells.join('')}${flip ? `<span class="font-bold text-amber-200 text-sm">${colScore(col)}</span>` : ''}</button>`;
    }).join('');
    const n = names()[p];
    const head = `<div class="flex items-center justify-between w-full px-1"><span class="font-display ${me ? 'text-amber-300' : 'text-amber-100/70'}">${me ? '▶ ' : ''}${n}</span><span class="stat-chip">Total <b class="text-amber-200 text-base ml-1">${total(S.g[p])}</b></span></div>`;
    return `<div class="flex flex-col items-center gap-1.5 w-full">${flip ? head : ''}<div class="flex gap-2 justify-center">${cols}</div>${flip ? '' : head}</div>`;
  }
  function render() {
    if (!root || !S) return;
    const p = S.turn, n = names(), aiTurn = mode === 'ai' && p === 1;
    const msg = S.over ? 'Game over' : !S.die ? 'Rolling…' : aiTurn ? 'The Bone Keeper is choosing a column…' : `${n[p]}: tap a column for your ${S.die}.`;
    root.innerHTML = `<div class="flex flex-col items-center gap-3 mx-auto w-full" style="max-width:440px">
      ${board(1, true)}
      <div class="flex items-center gap-3 walnut-panel rounded-2xl px-4 py-2 w-full justify-center">
        <div style="min-width:56px;min-height:56px" class="flex items-center justify-center">${S.die ? dieHtml(S.die, 52) : ''}</div>
        <div class="text-sm text-amber-50/90 text-left flex-1">${msg}</div>
      </div>
      ${board(0, false)}
      <div class="flex gap-2 flex-wrap justify-center">${Util.btn(mode === 'ai' ? '👥 Pass & Play' : '🤖 vs AI', `Knucklebones.setMode('${mode === 'ai' ? '2p' : 'ai'}')`)}${Util.btn('🔄 New game', 'Knucklebones.newGame()', 'brass')}</div>
      <p class="text-[11px] text-amber-100/50 text-center max-w-sm">Matching dice in your column multiply (two 4s score 16, three score 36). Placing a die knocks out every matching die in your rival's facing column.</p>
    </div>`;
  }
  return {
    mount(el, o = {}) {
      root = el; if (o.mode) { mode = o.mode; Store.set('kb_mode', mode); }
      if (o.resume) { mode = o.resume.mode; S = o.resume.S; sid++; busy = false; S.die = 0; startTurn(); } else newGame();
    },
    snapshot() { return S && !S.over ? { S: { ...S, die: 0 }, mode } : null; },
    destroy() { sid++; root = null; },
    place: c => place(c, false), newGame, setMode(m) { mode = m; Store.set('kb_mode', m); newGame(); },
    _test: { get S() { return S; }, colScore, aiPick }
  };
})();
Games.knucklebones = Knucklebones;

App.init();
</script>

<style id="kg-install-style">
html:not(.kg-can-install) [data-install]{display:none!important}
.kg-sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483000;width:min(420px,calc(100% - 24px));background:#2a190f;color:#fbf7ee;border:2px solid #d4af37;border-radius:16px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.35);font:15px/1.45 system-ui,sans-serif;display:grid;gap:10px;text-align:left}
.kg-sheet b{font-size:17px}
.kg-sheet p{margin:0}
.kg-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kg-row button{font:inherit;font-weight:700;border-radius:999px;padding:9px 16px;cursor:pointer;border:2px solid #d4af37;background:transparent;color:inherit}
.kg-row .kg-yes{background:#d4af37;border-color:#d4af37;color:#1f1409}
.kg-row button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
</style>
<script id="kg-install">
(function(){
  var NAME='The Grand Tabletop Compendium',KEY='gtc-install-snooze',AUTO=0;
  var evt=null,sheet=null,root=document.documentElement;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function standalone(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}
  function can(){return !standalone()&&(!!evt||ios)}
  function sync(){root.classList.toggle('kg-can-install',can())}
  function snoozed(){try{return Date.now()<(+localStorage.getItem(KEY)||0)}catch(e){return false}}
  function snooze(days){try{localStorage.setItem(KEY,String(Date.now()+days*864e5))}catch(e){}}
  function close(){if(sheet){sheet.remove();sheet=null}}
  function show(auto){close();var iosHelp=!evt&&ios;sheet=document.createElement('div');sheet.className='kg-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','Install '+NAME);
    sheet.innerHTML='<b>Install '+NAME+'?</b><p>'+(iosHelp?'In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It then opens full screen and works offline.':'Put it on your home screen and play full screen like a proper app, even without a signal.')+'</p><div class="kg-row"><button type="button" class="kg-no">'+(iosHelp?'Got it':'Not now')+'</button>'+(iosHelp?'':'<button type="button" class="kg-yes">Install</button>')+'</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('.kg-no').onclick=function(){snooze(auto?3:1);close()};
    var y=sheet.querySelector('.kg-yes');if(y){y.onclick=install;y.focus()}}
  function install(){close();var e=evt;evt=null;if(!e){sync();return}e.prompt();Promise.resolve(e.userChoice).then(sync,sync)}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;sync();if(AUTO&&!snoozed())setTimeout(function(){if(evt&&!sheet&&!standalone())show(true)},AUTO)});
  addEventListener('appinstalled',function(){evt=null;sync();close()});
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-install]');if(!b)return;e.preventDefault();e.stopPropagation();if(evt)install();else if(ios)show(false)},true);
  sync();
  window.KralnuInstall={can:can,open:function(){show(false)}};
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>

<style id="kg-update-style">
.kg-upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 24px));transition:transform .35s ease;z-index:2147483001;width:min(440px,calc(100% - 20px));box-sizing:border-box;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#2a190f;color:#fbf7ee;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4);font:600 14px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left;letter-spacing:0;text-transform:none}
.kg-upd.on{transform:translate(-50%,0)}
.kg-upd span{flex:1 1 160px}
.kg-upd button{font:inherit;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;white-space:nowrap;width:auto;margin:0}
.kg-upd .kg-go{background:#d4af37;border-color:#d4af37;color:#1f1409}
.kg-upd button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.kg-upd{transition:none}}
</style>
<script id="kg-update">
// Kralnu Games update check. When you push an update, change the game's version
// AND version.json to the same new value; players then get a "new version" notice.
(function(){
  var NAME="The Grand Tabletop Compendium",BUILD="1.7.1",CACHES=["gtc-"],CHECK=true;
  var path=location.pathname,dir=path.replace(/[^/]*$/,''),last=0,bar=null,busy=false;
  if(/^\?v=\d+$/.test(location.search)){try{history.replaceState(history.state,'',path+location.hash)}catch(e){}}
  function build(){return String(window.kgBuild!=null?window.kgBuild:BUILD)}
  function skipped(v){try{return sessionStorage.getItem('kg-upd-skip')===v}catch(e){return false}}
  function hide(){if(!bar)return;var b=bar;bar=null;b.classList.remove('on');setTimeout(function(){b.remove()},400)}
  function note(html,buttons){hide();bar=document.createElement('div');bar.className='kg-upd';bar.setAttribute('role','status');
    bar.innerHTML='<span>'+html+'</span>'+buttons;document.body.appendChild(bar);
    var b=bar;requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('on')})});return b}
  function latest(){return fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function now(){if(busy)return;busy=true;
    // Only clear the offline copy once we know the newest version can be downloaded.
    latest().then(function(){
      try{window.kgBeforeUpdate&&window.kgBeforeUpdate()}catch(e){}
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return r.scope.indexOf(location.origin+dir)===0}).map(function(r){return r.unregister()}))}))}catch(e){}
      try{if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return CACHES.some(function(p){return k.indexOf(p)===0})}).map(function(k){return caches.delete(k)}))}))}catch(e){}
      var done=false,go=function(){if(done)return;done=true;location.replace(path+'?v='+Date.now())};
      Promise.all(jobs).then(go,go);setTimeout(go,3000);
    },function(){busy=false;
      var b=note('No connection right now. Get online, then try again.','<button type="button" class="kg-later">OK</button>');
      b.querySelector('.kg-later').onclick=hide;setTimeout(function(){if(bar===b)hide()},6000);
    });
  }
  function show(v){if(bar||skipped(v))return;
    var b=note('A new version of '+NAME+' is ready.','<button type="button" class="kg-later">Later</button><button type="button" class="kg-go">Update</button>');
    b.querySelector('.kg-go').onclick=now;
    b.querySelector('.kg-later').onclick=function(){try{sessionStorage.setItem('kg-upd-skip',v)}catch(e){}hide()};
  }
  function check(force){if(!CHECK)return;var t=Date.now();if(!force&&t-last<6e5)return;last=t;
    latest().then(function(j){if(j&&j.version!=null&&String(j.version)!==build())show(String(j.version))}).catch(function(){})}
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-get-latest]');if(!b)return;e.preventDefault();e.stopPropagation();now()},true);
  addEventListener('load',function(){setTimeout(function(){check(true)},4000)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check(false)});
  setInterval(function(){if(!document.hidden)check(false)},18e5);
  window.KralnuUpdate={now:now,check:function(){check(true)},build:build};
})();
</script>

</body>
</html>
